[package]
name = "webaccess"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8.44"
fastrand = "2.5.0"
httpdate = "1.0.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "http2", "rustls-no-provider", "system-proxy"] }
rlimit = "0.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
toml = "1.2.1"
url = "2.5.8"
