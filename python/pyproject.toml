[project]
name = "web-access-framework"
version = "0.1.0"
description = "Fast, polite, parallel web access engine that goals (scrapers, watchers, agents) build on."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "selectolax>=1.0", "certifi"]

[project.optional-dependencies]
fast = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
webaccess = "webaccess.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webaccess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
