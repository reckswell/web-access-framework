name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest -q python/tests
      - run: python conformance/run.py -- python -m webaccess

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --release
        working-directory: rust
      - run: cargo build --release
        working-directory: rust
      - run: python conformance/run.py -- ${{ runner.os == 'Windows' && 'rust/target/release/webaccess.exe' || 'rust/target/release/webaccess' }}
      - uses: actions/upload-artifact@v4  # prebuilt binaries, e.g. for bench/run.py on a PC without Rust
        with:
          name: webaccess-${{ runner.os }}
          path: |
            rust/target/release/webaccess${{ runner.os == 'Windows' && '.exe' || '' }}
            rust/target/release/examples/bench_server${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 30
